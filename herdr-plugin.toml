# herdr-slurm — live Slurm/PBS job monitor sidebar for herdr.
#
# Rust implementation. Subcommands:
#   herdr-slurm          (default) sidebar TUI pane
#   herdr-slurm open     open/resize the sidebar pane
#   herdr-slurm refresh  one-shot scheduler snapshot to stdout
#   herdr-slurm start    ensure the detached sidebar-token daemon runs
#   herdr-slurm stop     stop that daemon
#   herdr-slurm daemon   foreground poll/report loop (internal)
#
# Configure machines in the plugin config dir:
#   herdr plugin config-dir ivan.herdr-slurm
#   -> machines.toml (auto-created with a template on first run)

id = "ivan.herdr-slurm"
name = "Scheduler Jobs Sidebar"
version = "0.4.0"
min_herdr_version = "0.8.0"
description = "Live Slurm and PBS job monitor sidebar for clusters over SSH."
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["cargo", "build", "--release"]

# Keep the Machines sidebar `$slurm` token alive without the jobs pane:
# spawn the detached squeue poller/token reporter if it is not running yet.
# Idempotent — safe to run at every herdr server start / live handoff.
[[startup]]
command = ["./target/release/herdr-slurm", "start"]
platforms = ["linux", "macos"]

[[startup]]
command = [".\\target\\release\\herdr-slurm.exe", "start"]
platforms = ["windows"]

[[panes]]
id = "jobs"
title = "Scheduler Jobs"
placement = "split"
command = ["./target/release/herdr-slurm"]
platforms = ["linux", "macos"]

[[panes]]
id = "jobs-windows"
title = "Scheduler Jobs"
placement = "split"
command = [".\\target\\release\\herdr-slurm.exe"]
platforms = ["windows"]

# Manual one-shot refresh, printed to the pane the action is invoked from.
[[actions]]
id = "refresh"
title = "Scheduler: refresh now"
contexts = ["workspace"]
command = ["./target/release/herdr-slurm", "refresh"]
platforms = ["linux", "macos"]

[[actions]]
id = "refresh-windows"
title = "Scheduler: refresh now"
contexts = ["workspace"]
command = [".\\target\\release\\herdr-slurm.exe", "refresh"]
platforms = ["windows"]

# Open (or focus) the sidebar at sidebar width.
[[actions]]
id = "open"
title = "Scheduler: toggle jobs sidebar"
contexts = ["workspace"]
command = ["./target/release/herdr-slurm", "open"]
platforms = ["linux", "macos"]

[[actions]]
id = "open-windows"
title = "Scheduler: toggle jobs sidebar"
contexts = ["workspace"]
command = [".\\target\\release\\herdr-slurm.exe", "open"]
platforms = ["windows"]
